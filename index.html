<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Yvonne's Weekly Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; overscroll-behavior-y: none; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

const STORAGE_KEY = "lifedash:standalone:v1";

const C = {
  bg: "#FBF3E4", surface: "#FFFFFF", surfaceMuted: "#FDF8EF",
  border: "rgba(58,50,42,0.10)", borderStrong: "rgba(58,50,42,0.20)",
  ink: "#3A322A", inkMuted: "#8A7C6C",
  accent: "#C98A46", accentSoft: "#F3E2C8",
  overdue: "#B33F2E", overdueSoft: "#FBE7E1", soon: "#5B7C93",
  shadow: "0 1px 2px rgba(58,50,42,0.05), 0 6px 16px rgba(58,50,42,0.05)",
};

// ---- tiny hand-rolled icon set (no external icon package needed) ----
function Icon({ name, size = 15, color = "currentColor" }) {
  const s = { width: size, height: size, display: "block" };
  const common = { viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: s };
  switch (name) {
    case "grid": return <svg {...common}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
    case "sun": return <svg {...common}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "calendar": return <svg {...common}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>;
    case "briefcase": return <svg {...common}><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "heart": return <svg {...common}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>;
    case "compass": return <svg {...common}><circle cx="12" cy="12" r="10"/><path d="M16 8l-2.5 6.5L8 17l2.5-6.5L16 8Z"/></svg>;
    case "sparkles": return <svg {...common}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg>;
    case "flag": return <svg {...common}><path d="M4 3v18"/><path d="M4 4h11l-1.5 4L15 12H4"/></svg>;
    case "star": return <svg {...common}><path d="M12 2l2.8 6.6 7.2.6-5.5 4.7 1.7 7L12 17.3 5.8 20.9l1.7-7L2 9.2l7.2-.6L12 2Z"/></svg>;
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14"/></svg>;
    case "x": return <svg {...common}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case "check": return <svg {...common}><path d="M20 6 9 17l-5-5"/></svg>;
    case "circle": return <svg {...common}><circle cx="12" cy="12" r="9"/></svg>;
    case "checkCircle": return <svg {...common}><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>;
    case "pencil": return <svg {...common}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
    case "trash": return <svg {...common}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>;
    case "alert": return <svg {...common}><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>;
    case "chevronDown": return <svg {...common}><path d="m6 9 6 6 6-6"/></svg>;
    case "chevronUp": return <svg {...common}><path d="m18 15-6-6-6 6"/></svg>;
    case "chevronLeft": return <svg {...common}><path d="m15 18-6-6 6-6"/></svg>;
    case "chevronRight": return <svg {...common}><path d="m9 18 6-6-6-6"/></svg>;
    case "barChart": return <svg {...common}><path d="M4 20V10M12 20V4M20 20v-7"/></svg>;
    case "download": return <svg {...common}><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 19h16"/></svg>;
    case "upload": return <svg {...common}><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M4 19h16"/></svg>;
    default: return null;
  }
}
function IconBox({ name, size = 15, color }) {
  return <span className="shrink-0 inline-flex items-center justify-center" style={{ width: size, height: size }}><Icon name={name} size={size} color={color} /></span>;
}

const BUILTIN_DOMAINS = [
  { key: "job", label: "Full-Time Job", tagline: "Career & work", color: "#5B7C93", iconName: "briefcase" },
  { key: "life", label: "Life & Responsibilities", tagline: "Home, health, family, admin", color: "#C1704F", iconName: "heart" },
  { key: "peace", label: "Peace & Compass", tagline: "Travel advisory & Substack", color: "#3F8F7D", iconName: "compass" },
  { key: "pfi", label: "Purpose Fueled Impact", tagline: "Impact platform & consultancy", color: "#8C5B6F", iconName: "sparkles" },
];
const ICON_CHOICES = ["flag","star","sparkles","heart","compass","briefcase","sun","calendar"];
const EXTRA_COLORS = ["#7A8C4E","#A6763F","#6B7FA6","#B25F72","#5C9C8C","#9C7A4E","#6F8C7A","#A6597A"];
const FALLBACK_DOMAIN = { key: "unknown", label: "Unassigned", tagline: "", color: C.inkMuted, iconName: "flag" };
const DomainsContext = createContext([]);
const emptyTop5 = () => Array.from({ length: 5 }, () => ({ text: "", domain: "", done: false, today: false }));

function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function domainOf(domains, key) { return domains.find((d) => d.key === key) || FALLBACK_DOMAIN; }
function shortDate(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function dueLabel(due) {
  if (!due) return null;
  const t = todayStr();
  if (due < t) return { text: "Overdue", tone: "overdue" };
  if (due === t) return { text: "Today", tone: "today" };
  const days = Math.round((new Date(due) - new Date(t)) / 86400000);
  if (days <= 7) return { text: due.slice(5), tone: "soon" };
  return { text: due.slice(5), tone: "later" };
}
function goalProgress(goal) {
  if (!goal.steps.length) return goal.status === "done" ? 100 : 0;
  return Math.round((goal.steps.filter((s) => s.done).length / goal.steps.length) * 100);
}
function isGoalDone(goal) { return goal.status === "done"; }
function startOfWeek(offset) {
  const d = new Date(); const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day + offset * 7); d.setHours(0, 0, 0, 0);
  return d;
}
function toDateStr(d) { return d.toISOString().slice(0, 10); }
function weekDays(offset) {
  const start = startOfWeek(offset);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
}

// ---- storage: real browser localStorage, synchronous and reliable ----
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveData(payload) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    return true;
  } catch (e) { return false; }
}

function App() {
  const initial = loadData();
  const [goals, setGoals] = useState(initial?.goals || []);
  const [notes, setNotes] = useState(initial?.notes || {});
  const [customDomains, setCustomDomains] = useState(initial?.customDomains || []);
  const [weeklyTop5, setWeeklyTop5] = useState(initial?.weeklyTop5?.length === 5 ? initial.weeklyTop5 : emptyTop5());
  const [view, setView] = useState("overview");
  const [error, setError] = useState("");
  const [goalForm, setGoalForm] = useState(null);
  const [dayForm, setDayForm] = useState(null);
  const [domainForm, setDomainForm] = useState(null);
  const [confirmAction, setConfirmAction] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const fileInputRef = useRef(null);

  useEffect(() => {
    const ok = saveData({ goals, notes, weeklyTop5, customDomains });
    setError(ok ? "" : "Couldn't save to this browser's storage.");
  }, [goals, notes, weeklyTop5, customDomains]);

  const allDomains = useMemo(
    () => [...BUILTIN_DOMAINS, ...customDomains.map((cd) => ({ ...cd }))],
    [customDomains]
  );

  function openNewGoal(domain) { setGoalForm({ id: null, domain, title: "", description: "", startDate: "", targetDate: "" }); }
  function openEditGoal(goal) { setGoalForm({ id: goal.id, domain: goal.domain, title: goal.title, description: goal.description, startDate: goal.startDate || "", targetDate: goal.targetDate }); }
  function saveGoal() {
    if (!goalForm.title.trim()) return;
    if (goalForm.id) setGoals((gs) => gs.map((g) => (g.id === goalForm.id ? { ...g, ...goalForm } : g)));
    else setGoals((gs) => [...gs, { ...goalForm, id: uid(), status: "active", steps: [], createdAt: Date.now() }]);
    setGoalForm(null);
  }
  function removeGoal(id) { setGoals((gs) => gs.filter((g) => g.id !== id)); }
  function toggleGoalStatus(id) { setGoals((gs) => gs.map((g) => (g.id === id ? { ...g, status: g.status === "done" ? "active" : "done" } : g))); }
  function addStep(goalId, title, due) {
    if (!title.trim()) return;
    setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: [...g.steps, { id: uid(), title, due: due || "", done: false, today: false, inProgress: false }] } : g)));
  }
  function toggleStepDone(goalId, stepId) { setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: g.steps.map((s) => (s.id === stepId ? { ...s, done: !s.done, inProgress: s.done ? s.inProgress : false } : s)) } : g))); }
  function toggleStepInProgress(goalId, stepId) { setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: g.steps.map((s) => (s.id === stepId ? { ...s, inProgress: !s.inProgress, done: s.inProgress ? s.done : false } : s)) } : g))); }
  function toggleStepToday(goalId, stepId) { setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: g.steps.map((s) => (s.id === stepId ? { ...s, today: !s.today } : s)) } : g))); }
  function removeStep(goalId, stepId) { setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: g.steps.filter((s) => s.id !== stepId) } : g))); }
  function clearCompletedGoals(domainKey) { setGoals((gs) => gs.filter((g) => !(g.domain === domainKey && isGoalDone(g)))); }
  function clearCompletedTasks(goalId) { setGoals((gs) => gs.map((g) => (g.id === goalId ? { ...g, steps: g.steps.filter((s) => !s.done) } : g))); }
  function updateNote(domain, text) { setNotes((n) => ({ ...n, [domain]: text })); }
  function updateTop5Slot(index, patch) { setWeeklyTop5((arr) => arr.map((s, i) => (i === index ? { ...s, ...patch } : s))); }

  function openNewDomain() { setDomainForm({ label: "", tagline: "", iconName: "flag" }); }
  function saveDomain() {
    if (!domainForm.label.trim()) return;
    const key = uid();
    const color = EXTRA_COLORS[customDomains.length % EXTRA_COLORS.length];
    setCustomDomains((cds) => [...cds, { key, label: domainForm.label.trim(), tagline: domainForm.tagline.trim(), iconName: domainForm.iconName, color }]);
    setNotes((n) => ({ ...n, [key]: "" }));
    setDomainForm(null);
    setView(key);
  }
  function removeDomain(key) {
    setCustomDomains((cds) => cds.filter((d) => d.key !== key));
    setGoals((gs) => gs.filter((g) => g.domain !== key));
    setNotes((n) => { const next = { ...n }; delete next[key]; return next; });
    setWeeklyTop5((arr) => arr.map((s) => (s.domain === key ? { ...s, domain: "" } : s)));
    if (view === key) setView("overview");
  }

  function exportBackup() {
    const payload = { goals, notes, weeklyTop5, customDomains, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `life-dashboard-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.goals)) { setError("That file doesn't look like a valid backup."); return; }
        setConfirmAction({ kind: "import-backup", data: parsed });
      } catch (err) { setError("Couldn't read that file."); }
    };
    reader.readAsText(file);
  }
  function applyImport(data) {
    setGoals(Array.isArray(data.goals) ? data.goals : []);
    setNotes(data.notes && typeof data.notes === "object" ? data.notes : {});
    setWeeklyTop5(Array.isArray(data.weeklyTop5) && data.weeklyTop5.length === 5 ? data.weeklyTop5 : emptyTop5());
    setCustomDomains(Array.isArray(data.customDomains) ? data.customDomains : []);
  }

  const allSteps = goals.flatMap((g) => g.steps.map((s) => ({ ...s, domain: g.domain, goalId: g.id, goalTitle: g.title })));
  const todaySteps = allSteps.filter((s) => !s.done && (s.today || s.due === todayStr()));

  return (
    <DomainsContext.Provider value={allDomains}>
      <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "Inter, sans-serif" }} className="flex">
        <style>{`::selection{background:${C.accentSoft};color:${C.ink}} input,select,textarea{font-family:Inter,sans-serif} input::placeholder,textarea::placeholder{color:${C.inkMuted};opacity:.7}`}</style>

        {sidebarOpen ? (
          <Sidebar view={view} setView={setView} todayCount={todaySteps.length} customKeys={new Set(customDomains.map((d) => d.key))} onAddDomain={openNewDomain} onRemoveDomain={(d) => setConfirmAction({ kind: "delete-domain", domain: d })} onExport={exportBackup} onImportClick={() => fileInputRef.current && fileInputRef.current.click()} onCollapse={() => setSidebarOpen(false)} />
        ) : (
          <button onClick={() => setSidebarOpen(true)} className="fixed top-4 left-4 z-20 p-2 rounded-xl" style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: C.shadow }} title="Open sidebar">
            <Icon name="chevronRight" size={16} color={C.ink} />
          </button>
        )}
        <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: "none" }} />

        <main className="flex-1 min-w-0">
          <div className="max-w-5xl mx-auto px-4 pt-6 md:pt-10 pb-24">
            {error && <div className="mb-4 px-3 py-2 rounded-xl flex items-center gap-2" style={{ background: C.overdueSoft, color: C.overdue }}><IconBox name="alert" size={16} color={C.overdue} /><span className="text-sm">{error}</span></div>}

            <TopSection goals={goals} weeklyTop5={weeklyTop5} onUpdateSlot={updateTop5Slot} />

            <div className="mt-8">
              {view === "overview" && <Overview goals={goals} setView={setView} />}
              {view === "today" && <TodayView steps={todaySteps} onToggleDone={toggleStepDone} onToggleToday={toggleStepToday} onToggleInProgress={toggleStepInProgress} />}
              {view === "week" && <WeekView goals={goals} onToggleDone={toggleStepDone} onToggleInProgress={toggleStepInProgress} onOpenAdd={(domainKey, dateStr) => setDayForm({ domain: domainKey, goalId: "", title: "", due: dateStr })} />}
              {allDomains.map((d) => view === d.key && (
                <DomainView key={d.key} domain={d} goals={goals.filter((g) => g.domain === d.key)} note={notes[d.key]}
                  onNoteChange={(text) => updateNote(d.key, text)} onAddGoal={() => openNewGoal(d.key)} onEditGoal={openEditGoal}
                  onRemoveGoal={removeGoal} onToggleGoalStatus={toggleGoalStatus} onAddStep={addStep} onToggleStepDone={toggleStepDone}
                  onToggleStepToday={toggleStepToday} onToggleStepInProgress={toggleStepInProgress} onRemoveStep={removeStep} onRequestConfirm={setConfirmAction} />
              ))}
            </div>
          </div>
        </main>

        {goalForm && <GoalFormModal form={goalForm} setForm={setGoalForm} onSave={saveGoal} onClose={() => setGoalForm(null)} />}
        {dayForm && <DayStepModal form={dayForm} setForm={setDayForm} goals={goals} onClose={() => setDayForm(null)} onSave={() => { if (dayForm.goalId && dayForm.title.trim()) addStep(dayForm.goalId, dayForm.title, dayForm.due); setDayForm(null); }} />}
        {domainForm && <DomainFormModal form={domainForm} setForm={setDomainForm} onSave={saveDomain} onClose={() => setDomainForm(null)} />}

        {confirmAction?.kind === "delete-domain" && (
          <ConfirmModal title={`Delete "${confirmAction.domain.label}"?`}
            message={(() => { const c = goals.filter((g) => g.domain === confirmAction.domain.key).length; return c > 0 ? `This will also delete ${c} goal${c !== 1 ? "s" : ""} and all of their tasks. This can't be undone.` : "This can't be undone."; })()}
            confirmLabel="Delete" onCancel={() => setConfirmAction(null)} onConfirm={() => { removeDomain(confirmAction.domain.key); setConfirmAction(null); }} />
        )}
        {confirmAction?.kind === "clear-goals" && (
          <ConfirmModal title="Clear completed goals?" message={`This will permanently remove ${confirmAction.count} completed goal${confirmAction.count !== 1 ? "s" : ""} from ${confirmAction.domainLabel}, along with their tasks. This can't be undone.`}
            confirmLabel="Clear" onCancel={() => setConfirmAction(null)} onConfirm={() => { clearCompletedGoals(confirmAction.domainKey); setConfirmAction(null); }} />
        )}
        {confirmAction?.kind === "clear-tasks" && (
          <ConfirmModal title="Clear completed tasks?" message={`This will permanently remove ${confirmAction.count} completed task${confirmAction.count !== 1 ? "s" : ""} from "${confirmAction.goalTitle}". This can't be undone.`}
            confirmLabel="Clear" onCancel={() => setConfirmAction(null)} onConfirm={() => { clearCompletedTasks(confirmAction.goalId); setConfirmAction(null); }} />
        )}
        {confirmAction?.kind === "import-backup" && (
          <ConfirmModal title="Import this backup?" message="This will replace everything currently in your dashboard with the contents of this file. This can't be undone."
            confirmLabel="Import" onCancel={() => setConfirmAction(null)} onConfirm={() => { applyImport(confirmAction.data); setConfirmAction(null); }} />
        )}
      </div>
    </DomainsContext.Provider>
  );
}

function Sidebar({ view, setView, todayCount, customKeys, onAddDomain, onRemoveDomain, onExport, onImportClick, onCollapse }) {
  const domains = useContext(DomainsContext);
  return (
    <aside className="w-48 sm:w-56 shrink-0 h-screen sticky top-0 overflow-y-auto" style={{ background: C.surface, borderRight: `1px solid ${C.border}` }}>
      <div className="p-3 sm:p-4 h-full flex flex-col">
        <div className="flex items-center justify-between gap-2 mb-5">
          <div className="flex items-center gap-2 min-w-0">
            <IconBox name="compass" size={18} color={C.accent} />
            <span style={{ fontFamily: "Fraunces, serif", fontWeight: 600, color: C.ink }} className="text-base truncate">Yvonne's Weekly Dashboard</span>
          </div>
          <button onClick={onCollapse} className="shrink-0 p-1 rounded-lg" style={{ color: C.inkMuted }} title="Close sidebar"><Icon name="chevronLeft" size={16} /></button>
        </div>
        <div className="flex flex-col gap-1.5 flex-1">
          <SideNavButton active={view === "overview"} onClick={() => setView("overview")} iconName="grid" label="Overview" />
          <SideNavButton active={view === "today"} onClick={() => setView("today")} iconName="sun" label={`Today${todayCount ? ` (${todayCount})` : ""}`} />
          <SideNavButton active={view === "week"} onClick={() => setView("week")} iconName="calendar" label="This week" />
          <div className="my-2" style={{ borderTop: `1px solid ${C.border}` }} />
          {domains.map((d) => (
            <SideNavButton key={d.key} active={view === d.key} onClick={() => setView(d.key)} iconName={d.iconName} label={d.label} accent={d.color} onRemove={customKeys.has(d.key) ? () => onRemoveDomain(d) : null} />
          ))}
          <button onClick={onAddDomain} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium w-full mt-1" style={{ color: C.inkMuted, border: `1px dashed ${C.borderStrong}` }}><IconBox name="plus" size={15} color={C.inkMuted} /><span>Add domain</span></button>
        </div>
        <div className="pt-3 mt-3" style={{ borderTop: `1px solid ${C.border}` }}>
          <p style={{ color: C.inkMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", letterSpacing: "0.08em" }} className="uppercase mb-2 px-1">Backup</p>
          <button onClick={onExport} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium w-full" style={{ color: C.ink }}><IconBox name="download" size={15} color={C.ink} /><span>Export backup</span></button>
          <button onClick={onImportClick} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium w-full" style={{ color: C.ink }}><IconBox name="upload" size={15} color={C.ink} /><span>Import backup</span></button>
          <p style={{ color: C.inkMuted }} className="text-xs px-3 mt-1 leading-snug">Export before redeploying this site to a new version.</p>
        </div>
      </div>
    </aside>
  );
}

function SideNavButton({ active, onClick, iconName, label, accent = C.accent, onRemove }) {
  return (
    <div className="flex items-center gap-1">

function Top5Slot({ index, slot, onUpdate }) {
  const domains = useContext(DomainsContext);
  const [editing, setEditing] = useState(false);
  const [draftText, setDraftText] = useState(slot.text);
  const [draftDomain, setDraftDomain] = useState(slot.domain);
  const domain = slot.domain ? domainOf(domains, slot.domain) : null;
  function save() { onUpdate({ text: draftText, domain: draftDomain }); setEditing(false); }
  function clear() { onUpdate({ text: "", domain: "", done: false, today: false }); setEditing(false); }
  if (editing) return (
    <div className="p-2 rounded-xl" style={{ background: C.surfaceMuted, border: `1px solid ${C.border}` }}>
      <input autoFocus value={draftText} onChange={(e) => setDraftText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && save()} placeholder="This week's priority…" className="w-full px-2 py-1 rounded-lg text-sm outline-none mb-1.5" style={{ background: C.surface, color: C.ink, border: `1px solid ${C.border}` }} />
      <div className="flex items-center gap-1.5">
        <select value={draftDomain} onChange={(e) => setDraftDomain(e.target.value)} className="flex-1 px-2 py-1 rounded-lg text-xs outline-none" style={{ background: C.surface, color: C.ink, border: `1px solid ${C.border}` }}>
          <option value="">No domain tag</option>{domains.map((d) => <option key={d.key} value={d.key}>{d.label}</option>)}
        </select>
        <button onClick={save} className="px-2 py-1 rounded-lg" style={{ background: C.accent, color: "#FFFFFF" }}><Icon name="check" size={13} color="#fff" /></button>
        <button onClick={() => setEditing(false)} className="px-2 py-1 rounded-lg" style={{ background: "transparent", color: C.inkMuted, border: `1px solid ${C.border}` }}><Icon name="x" size={13} /></button>
      </div>
    </div>
  );
  if (!slot.text) return (
    <button onClick={() => setEditing(true)} className="w-full flex items-center gap-2 p-2 rounded-xl text-left" style={{ border: `1px dashed ${C.borderStrong}` }}>
      <span style={{ color: C.inkMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px" }}>{index + 1}</span>
      <span style={{ color: C.inkMuted }} className="text-sm">Add priority #{index + 1}</span>
    </button>
  );
  return (
    <div className="flex items-center gap-2 p-2 rounded-xl" style={{ background: C.surfaceMuted, opacity: slot.done ? 0.55 : 1 }}>
      <span style={{ color: C.inkMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px" }} className="shrink-0">{index + 1}</span>
      <button onClick={() => onUpdate({ done: !slot.done })} className="shrink-0"><Icon name={slot.done ? "checkCircle" : "circle"} size={16} color={slot.done ? (domain ? domain.color : C.accent) : C.inkMuted} /></button>
      <span style={{ color: C.ink, textDecoration: slot.done ? "line-through" : "none" }} className="text-sm flex-1 min-w-0 truncate">{slot.text}</span>
      {slot.today && <span style={{ color: C.accent, background: `${C.accent}22`, fontFamily: "'IBM Plex Mono', monospace", fontSize: "9px" }} className="px-1.5 py-0.5 rounded-full uppercase shrink-0">Today</span>}
      {domain && <span style={{ width: 7, height: 7, borderRadius: "50%", background: domain.color }} className="shrink-0" />}
      <button onClick={() => onUpdate({ today: !slot.today })} className="shrink-0" title={slot.today ? "Unmark today" : "Mark today"}><Icon name="sun" size={13} color={slot.today ? C.accent : C.inkMuted} /></button>
      <button onClick={() => setEditing(true)} className="shrink-0"><Icon name="pencil" size={12} color={C.inkMuted} /></button>
      <button onClick={clear} className="shrink-0"><Icon name="x" size={13} color={C.inkMuted} /></button>
    </div>
  );
}

function GanttSection({ goals }) {
  const domains = useContext(DomainsContext);
  const rows = goals.filter((g) => !isGoalDone(g) && g.targetDate).map((g) => {
    const start = g.startDate || new Date(g.createdAt).toISOString().slice(0, 10);
    const end = g.targetDate < start ? start : g.targetDate;
    return { ...g, start, end };
  });
  if (rows.length === 0) return (
    <div className="p-4 rounded-2xl h-full flex flex-col" style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: C.shadow }}>
      <div className="flex items-center gap-1.5 mb-2"><IconBox name="barChart" size={15} color={C.accent} /><h2 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-base">Goal timeline</h2></div>
      <p style={{ color: C.inkMuted }} className="text-sm">Add a start and target date to a goal to see it mapped here.</p>
    </div>
  );
  const allDates = rows.flatMap((r) => [r.start, r.end]).concat([todayStr()]);
  const rangeStartRaw = allDates.reduce((min, d) => (d < min ? d : min), allDates[0]);
  const rangeEndRaw = allDates.reduce((max, d) => (d > max ? d : max), allDates[0]);
  const rs = new Date(rangeStartRaw); rs.setDate(rs.getDate() - 3);
  const re = new Date(rangeEndRaw); re.setDate(re.getDate() + 3);
  const totalMs = Math.max(re - rs, 86400000);
  function pct(dateStr) { return Math.min(100, Math.max(0, ((new Date(dateStr) - rs) / totalMs) * 100)); }
  const todayPct = pct(todayStr());
  const labelWidth = 128;
  const byDomain = domains.map((d) => ({ domain: d, items: rows.filter((r) => r.domain === d.key).sort((a, b) => a.start.localeCompare(b.start)) })).filter((row) => row.items.length > 0);
  return (
    <div className="p-4 rounded-2xl h-full" style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: C.shadow }}>
      <div className="flex items-center gap-1.5 mb-3"><IconBox name="barChart" size={15} color={C.accent} /><h2 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-base">Goal timeline</h2></div>
      <div style={{ overflowX: "auto" }}>
        <div style={{ minWidth: 420 }}>
          <div style={{ paddingLeft: labelWidth + 8, display: "flex", justifyContent: "space-between" }} className="mb-2">
            <span style={{ fontSize: 10, fontFamily: "'IBM Plex Mono', monospace", color: C.inkMuted }}>{shortDate(rs)}</span>
            <span style={{ fontSize: 10, fontFamily: "'IBM Plex Mono', monospace", color: C.inkMuted }}>{shortDate(re)}</span>
          </div>
          {byDomain.map(({ domain: d, items }) => (
            <div key={d.key} className="mb-3">
              <div className="flex items-center gap-2">
                <div style={{ width: labelWidth }} className="shrink-0 flex items-center gap-1.5 min-w-0"><IconBox name={d.iconName} size={12} color={d.color} /><span style={{ color: C.ink, fontSize: 12 }} className="truncate font-medium">{d.label}</span></div>
                <div className="relative flex-1" style={{ height: 14 }}>
                  <div className="absolute inset-0 rounded-full" style={{ background: C.surfaceMuted }} />
                  {items.map((g) => {
                    const progress = goalProgress(g); const left = pct(g.start); const width = Math.max(pct(g.end) - left, 2);
                    return (
                      <div key={g.id} title={`${g.title} · ${shortDate(new Date(g.start))} – ${shortDate(new Date(g.end))}`}>
                        <div className="absolute inset-y-0 rounded-full" style={{ left: `${left}%`, width: `${width}%`, background: `${d.color}33`, border: `1px solid ${C.surface}` }} />
                        <div className="absolute inset-y-0 rounded-full" style={{ left: `${left}%`, width: `${(width * progress) / 100}%`, background: d.color }} />
                      </div>
                    );
                  })}
                  {todayPct >= 0 && todayPct <= 100 && <div className="absolute inset-y-0" style={{ left: `${todayPct}%`, width: 1, background: C.accent }} />}
                </div>
              </div>
              <p style={{ color: C.inkMuted, fontSize: 11, paddingLeft: labelWidth + 8 }} className="mt-1 truncate">{items.map((g) => g.title).join(" · ")}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function GoalCard({ goal, domain, onEdit, onRemove, onToggleStatus, onAddStep, onToggleStepDone, onToggleStepToday, onToggleStepInProgress, onRemoveStep, onRequestConfirm }) {
  const [expanded, setExpanded] = useState(true);
  const [stepTitle, setStepTitle] = useState("");
  const [stepDue, setStepDue] = useState("");
  const progress = goalProgress(goal);
  const done = isGoalDone(goal);
  const target = dueLabel(goal.targetDate);
  const targetColors = { overdue: C.overdue, today: C.accent, soon: C.soon, later: C.inkMuted };
  const doneTaskCount = goal.steps.filter((s) => s.done).length;
  function submitStep() { if (!stepTitle.trim()) return; onAddStep(stepTitle, stepDue); setStepTitle(""); setStepDue(""); }
  return (
    <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: C.shadow }}>
      <div className="p-4">
        <div className="flex items-start justify-between gap-2">
          <button onClick={() => setExpanded((e) => !e)} className="flex-1 text-left flex items-start gap-2">
            <Icon name="flag" size={16} color={domain.color} />
            <div className="min-w-0"><h3 style={{ color: C.ink, textDecoration: done ? "line-through" : "none" }} className="text-base font-semibold">{goal.title}</h3>{goal.description && <p style={{ color: C.inkMuted }} className="text-xs mt-0.5">{goal.description}</p>}</div>
          </button>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={onEdit}><Icon name="pencil" size={14} color={C.inkMuted} /></button>
            <button onClick={onRemove}><Icon name="trash" size={14} color={C.inkMuted} /></button>
            <button onClick={() => setExpanded((e) => !e)}><Icon name={expanded ? "chevronUp" : "chevronDown"} size={16} color={C.inkMuted} /></button>
          </div>
        </div>
        <div className="mt-3 flex items-center gap-3"><div className="flex-1"><ProgressBar value={progress} color={domain.color} /></div><span style={{ color: domain.color, fontFamily: "'IBM Plex Mono', monospace" }} className="text-xs shrink-0">{progress}%</span></div>
        <div className="flex items-center justify-between mt-2">
          <p style={{ color: C.inkMuted }} className="text-xs">{doneTaskCount}/{goal.steps.length} tasks{target && <span style={{ color: targetColors[target.tone] }}> · target {target.text}</span>}</p>
          <button onClick={onToggleStatus} style={{ color: done ? C.inkMuted : domain.color }} className="text-xs font-medium">{done ? "Reopen" : "Mark complete"}</button>
        </div>
      </div>
      {expanded && (
        <div className="px-4 pb-4 pt-1 space-y-2" style={{ borderTop: `1px solid ${C.border}` }}>
          {goal.steps.length === 0 && <p style={{ color: C.inkMuted }} className="text-xs pt-3">No tasks yet — break this goal into the next few actions.</p>}
          {goal.steps.map((s) => <StepRow key={s.id} step={s} domain={domain} onToggleDone={() => onToggleStepDone(s.id)} onToggleToday={() => onToggleStepToday(s.id)} onToggleInProgress={() => onToggleStepInProgress(s.id)} onRemove={() => onRemoveStep(s.id)} />)}
          {doneTaskCount > 0 && <button onClick={() => onRequestConfirm({ kind: "clear-tasks", goalId: goal.id, goalTitle: goal.title, count: doneTaskCount })} className="text-xs flex items-center gap-1 pt-1" style={{ color: C.inkMuted }}><Icon name="trash" size={11} /> Clear {doneTaskCount} completed task{doneTaskCount !== 1 ? "s" : ""}</button>}
          <div className="flex gap-2 pt-2">
            <input value={stepTitle} onChange={(e) => setStepTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitStep()} placeholder="Add a task…" className="flex-1 px-3 py-1.5 rounded-lg text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
            <input type="date" value={stepDue} onChange={(e) => setStepDue(e.target.value)} className="px-2 py-1.5 rounded-lg text-xs outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
            <button onClick={submitStep} className="px-3 rounded-lg" style={{ background: domain.color, color: "#FFFFFF" }}><Icon name="plus" size={14} color="#fff" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

function StepRow({ step, domain, showContext, onToggleDone, onToggleToday, onToggleInProgress, onRemove }) {
  const due = dueLabel(step.due);
  const dueColors = { overdue: C.overdue, today: C.accent, soon: C.soon, later: C.inkMuted };
  const statusColor = step.done ? domain.color : step.inProgress ? C.soon : C.inkMuted;
  return (
    <div className="flex items-start gap-2.5 p-2.5 rounded-xl" style={{ background: showContext ? C.surface : C.surfaceMuted, border: showContext ? `1px solid ${C.border}` : "none", boxShadow: showContext ? C.shadow : "none", opacity: step.done ? 0.5 : 1 }}>
      <button onClick={onToggleDone} className="mt-0.5 shrink-0"><Icon name={step.done ? "checkCircle" : "circle"} size={16} color={statusColor} /></button>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 flex-wrap">
          <span style={{ color: C.ink, textDecoration: step.done ? "line-through" : "none" }} className="text-sm">{step.title}</span>
          {step.inProgress && !step.done && <span style={{ color: C.soon, background: `${C.soon}1A`, fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px" }} className="px-1.5 py-0.5 rounded-full uppercase">In progress</span>}
        </div>
        {showContext && <div className="flex items-center gap-1.5 mt-0.5"><span style={{ color: domain.color, background: `${domain.color}1A`, fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px" }} className="px-1.5 py-0.5 rounded-full uppercase">{domain.label}</span><span style={{ color: C.inkMuted }} className="text-xs">{step.goalTitle}</span></div>}
        <div className="flex items-center gap-2 mt-1 flex-wrap">
          {due && <span style={{ color: dueColors[due.tone] }} className="text-xs font-medium">{due.text}</span>}
          {!step.done && (
            <button onClick={onToggleInProgress} style={{ color: step.inProgress ? C.soon : C.inkMuted }} className="text-xs flex items-center gap-1">
              <span style={{ width: 8, height: 8, borderRadius: "50%", border: "1.5px solid currentColor", background: step.inProgress ? "currentColor" : "transparent" }} />
              {step.inProgress ? "In progress" : "Mark in progress"}
            </button>
          )}
          <button onClick={onToggleToday} style={{ color: step.today ? C.accent : C.inkMuted }} className="text-xs flex items-center gap-1"><Icon name="sun" size={11} /> {step.today ? "Today" : "Mark today"}</button>
        </div>
      </div>
      {onRemove && <button onClick={onRemove} className="shrink-0 opacity-70"><Icon name="x" size={14} color={C.inkMuted} /></button>}
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="p-6 rounded-2xl text-center" style={{ background: C.surface, border: `1px dashed ${C.borderStrong}` }}><p style={{ color: C.inkMuted }} className="text-sm">{text}</p></div>;
}

function GoalFormModal({ form, setForm, onSave, onClose }) {
  const domains = useContext(DomainsContext);
  const d = domainOf(domains, form.domain);
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(58,50,42,0.35)", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-4"><h3 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-lg">{form.id ? "Edit goal" : "New goal"} <span style={{ color: d.color }}>· {d.label}</span></h3><button onClick={onClose}><Icon name="x" size={18} color={C.inkMuted} /></button></div>
        <div className="space-y-3">
          <input autoFocus value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="What are you working toward?" className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
          <textarea value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="Why this matters, or what 'done' looks like — optional" rows={2} className="w-full px-3 py-2 rounded-xl text-sm outline-none resize-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
          <div className="grid grid-cols-2 gap-2">
            <div><label style={{ color: C.inkMuted }} className="text-xs block mb-1">Start date — optional</label><input type="date" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} /></div>
            <div><label style={{ color: C.inkMuted }} className="text-xs block mb-1">Target date</label><input type="date" value={form.targetDate} onChange={(e) => setForm({ ...form, targetDate: e.target.value })} className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} /></div>
          </div>
          <p style={{ color: C.inkMuted }} className="text-xs">Add both dates to see this goal on the overall timeline.</p>
        </div>
        <div className="flex gap-2 mt-5"><button onClick={onClose} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: "transparent", color: C.inkMuted, border: `1px solid ${C.border}` }}>Cancel</button><button onClick={onSave} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: d.color, color: "#FFFFFF" }}><span className="flex items-center justify-center gap-1"><Icon name="check" size={14} color="#fff" /> Save</span></button></div>
      </div>
    </div>
  );
}

function DayStepModal({ form, setForm, goals, onSave, onClose }) {
  const domains = useContext(DomainsContext);
  const domain = domainOf(domains, form.domain);
  const domainGoals = goals.filter((g) => g.domain === form.domain && !isGoalDone(g));
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(58,50,42,0.35)", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-4"><h3 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-lg">Add task <span style={{ color: domain.color }}>· {domain.label}</span></h3><button onClick={onClose}><Icon name="x" size={18} color={C.inkMuted} /></button></div>
        <div className="space-y-3">
          <div>
            <label style={{ color: C.inkMuted }} className="text-xs block mb-1">Which goal is this task for?</label>
            {domainGoals.length === 0 ? <p style={{ color: C.inkMuted }} className="text-xs">No active goals in {domain.label} yet — add a goal there first.</p> : (
              <select value={form.goalId} onChange={(e) => setForm({ ...form, goalId: e.target.value })} className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }}>
                <option value="">Choose a goal…</option>{domainGoals.map((g) => <option key={g.id} value={g.id}>{g.title}</option>)}
              </select>
            )}
          </div>
          <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="Task title" className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
          <p style={{ color: C.inkMuted }} className="text-xs">Scheduled for {new Date(form.due + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</p>
        </div>
        <div className="flex gap-2 mt-5"><button onClick={onClose} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: "transparent", color: C.inkMuted, border: `1px solid ${C.border}` }}>Cancel</button><button onClick={onSave} disabled={!form.goalId || !form.title.trim()} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: domain.color, color: "#FFFFFF", opacity: !form.goalId || !form.title.trim() ? 0.5 : 1 }}><span className="flex items-center justify-center gap-1"><Icon name="check" size={14} color="#fff" /> Add task</span></button></div>
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, confirmLabel = "Delete", confirmColor = C.overdue, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(58,50,42,0.35)", zIndex: 60 }} onClick={onCancel}>
      <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-2 mb-2"><Icon name="alert" size={18} color={confirmColor} /><h3 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-lg">{title}</h3></div>
        <p style={{ color: C.inkMuted }} className="text-sm mb-5">{message}</p>
        <div className="flex gap-2"><button onClick={onCancel} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: "transparent", color: C.inkMuted, border: `1px solid ${C.border}` }}>Cancel</button><button onClick={onConfirm} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: confirmColor, color: "#FFFFFF" }}><span className="flex items-center justify-center gap-1"><Icon name="trash" size={14} color="#fff" /> {confirmLabel}</span></button></div>
      </div>
    </div>
  );
}

function DomainFormModal({ form, setForm, onSave, onClose }) {
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(58,50,42,0.35)", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-4"><h3 style={{ color: C.ink, fontFamily: "Fraunces, serif", fontWeight: 600 }} className="text-lg">New domain</h3><button onClick={onClose}><Icon name="x" size={18} color={C.inkMuted} /></button></div>
        <div className="space-y-3">
          <input autoFocus value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="Domain name (e.g. Health, Faith, Finances)" className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
          <input value={form.tagline} onChange={(e) => setForm({ ...form, tagline: e.target.value })} placeholder="Short tagline — optional" className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.surfaceMuted, color: C.ink, border: `1px solid ${C.border}` }} />
          <div>
            <label style={{ color: C.inkMuted }} className="text-xs block mb-2">Icon</label>
            <div className="flex flex-wrap gap-2">{ICON_CHOICES.map((name) => (
              <button key={name} onClick={() => setForm({ ...form, iconName: name })} className="p-2 rounded-xl" style={{ background: form.iconName === name ? C.accentSoft : C.surfaceMuted, border: `1px solid ${form.iconName === name ? C.accent : C.border}` }}><IconBox name={name} size={16} color={form.iconName === name ? C.accent : C.inkMuted} /></button>
            ))}</div>
          </div>
        </div>
        <div className="flex gap-2 mt-5"><button onClick={onClose} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: "transparent", color: C.inkMuted, border: `1px solid ${C.border}` }}>Cancel</button><button onClick={onSave} className="flex-1 py-2 rounded-xl text-sm font-medium" style={{ background: C.accent, color: "#FFFFFF" }}><span className="flex items-center justify-center gap-1"><Icon name="check" size={14} color="#fff" /> Add domain</span></button></div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
